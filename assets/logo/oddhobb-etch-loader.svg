<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="OddHobb etched loader v4">
  <defs>
    <clipPath id="oddhobb-boundary">
      <circle cx="500" cy="500" r="350"/>
    </clipPath>
  </defs>
  <style>
    :root { color:#000; }
    .oddhobb-path {
      fill:none;
      stroke:currentColor;
      stroke-width:26;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:1;
      stroke-dashoffset:1;
      animation:oddhobb-etch 3s cubic-bezier(.62,0,.38,1) infinite;
    }
    .rail-left  { animation-delay:.10s; }
    .rail-right { animation-delay:.22s; }
    .boundary   { animation-delay:.42s; }
    @keyframes oddhobb-etch {
      0%   { stroke-dashoffset:1; opacity:1; }
      50%  { stroke-dashoffset:0; opacity:1; }
      72%  { stroke-dashoffset:0; opacity:1; }
      96%  { stroke-dashoffset:-1; opacity:1; }
      100% { stroke-dashoffset:-1; opacity:0; }
    }
    @media (prefers-reduced-motion:reduce) {
      .oddhobb-path { animation:none; stroke-dashoffset:0; opacity:1; }
    }
  </style>
  <g clip-path="url(#oddhobb-boundary)">
    <path class="oddhobb-path rail-left" pathLength="1" d="M360 150
C360 285 370 410 410 500
C430 472 458 462 476 476
C497 492 498 528 477 548
C458 566 430 560 410 500
C388 542 366 590 360 640
C355 712 363 785 378 850"/>
    <path class="oddhobb-path rail-right" pathLength="1" d="M640 150
C640 285 630 410 590 500
C570 472 542 462 524 476
C503 492 502 528 523 548
C542 566 570 560 590 500
C612 542 634 590 640 640
C645 712 637 785 622 850"/>
  </g>
  <circle class="oddhobb-path boundary" pathLength="1"
          cx="500" cy="500" r="350"/>
</svg>
