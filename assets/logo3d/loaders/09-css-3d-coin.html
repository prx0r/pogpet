<style>
.oh-coin{--s:120px;--t:10px;width:var(--s);height:var(--s);perspective:600px}
.oh-coin__spin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:oh-spin 1.8s cubic-bezier(.45,.05,.55,.95) infinite}
.oh-coin__face{position:absolute;inset:0;backface-visibility:hidden}
.oh-coin__face svg{width:100%;height:100%;display:block}
.oh-coin__front{transform:translateZ(calc(var(--t)/2 + 1px))}
.oh-coin__back{transform:rotateY(180deg) translateZ(calc(var(--t)/2 + 1px))}
.oh-coin i{position:absolute;inset:calc(var(--s)*.072);border-radius:50%;
  background:repeating-conic-gradient(#2b2b2e 0 1.2deg,#0c0c0d 1.2deg 2.4deg);
  transform:translateZ(calc(var(--t)/2 - 1px - (var(--t) - 2px)*var(--i)/13))}
@keyframes oh-spin{0%{transform:rotateY(0) rotateX(8deg)}100%{transform:rotateY(360deg) rotateX(8deg)}}
@media (prefers-reduced-motion:reduce){.oh-coin__spin{animation:none}}
</style>
