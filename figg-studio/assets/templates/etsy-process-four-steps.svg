<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400"><title>figg four-step customer process — editable template</title><rect width="2400" height="2400" fill="#FAFAF8"/><text x="120" y="220" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="145" fill="#111111">figg<tspan fill="#8B3DFF">.</tspan></text><text x="120" y="420" font-family="Inter,Arial,sans-serif" font-weight="850" font-size="137" fill="#111111">Made just for you.</text><text x="120" y="515" font-family="Inter,Arial,sans-serif" font-size="58" fill="#77717C">One photo. One little character. A lot of personality.</text><g font-family="Inter,Arial,sans-serif"><g id="STEP-1"><rect x="110" y="670" width="1050" height="700" rx="45" fill="#FFF" stroke="#EAD8FF" stroke-width="5"/><circle cx="235" cy="795" r="51" fill="#8B3DFF"/><text x="218" y="813" fill="#FFF" font-weight="900" font-size="56">1</text><text x="330" y="809" fill="#111" font-weight="800" font-size="69">Upload a photo</text><text x="650" y="1100" text-anchor="middle" fill="#A390AC" font-size="52">INSERT YOUR PHOTO</text></g><g id="STEP-2"><rect x="1240" y="670" width="1050" height="700" rx="45" fill="#FFF" stroke="#EAD8FF" stroke-width="5"/><circle cx="1365" cy="795" r="51" fill="#8B3DFF"/><text x="1348" y="813" fill="#FFF" font-weight="900" font-size="56">2</text><text x="1460" y="809" fill="#111" font-weight="800" font-size="69">Choose your style</text><text x="1765" y="1100" text-anchor="middle" fill="#A390AC" font-size="49">INSERT APPROVED RENDER</text></g><g id="STEP-3"><rect x="110" y="1440" width="1050" height="700" rx="45" fill="#FFF" stroke="#EAD8FF" stroke-width="5"/><circle cx="235" cy="1565" r="51" fill="#8B3DFF"/><text x="218" y="1583" fill="#FFF" font-weight="900" font-size="56">3</text><text x="330" y="1579" fill="#111" font-weight="800" font-size="69">Approve the preview</text><text x="650" y="1870" text-anchor="middle" fill="#A390AC" font-size="46">INSERT APPROVAL PREVIEW</text></g><g id="STEP-4"><rect x="1240" y="1440" width="1050" height="700" rx="45" fill="#FFF" stroke="#EAD8FF" stroke-width="5"/><circle cx="1365" cy="1565" r="51" fill="#8B3DFF"/><text x="1348" y="1583" fill="#FFF" font-weight="900" font-size="56">4</text><text x="1460" y="1579" fill="#111" font-weight="800" font-size="69">Printed &amp; dispatched</text><text x="1765" y="1870" text-anchor="middle" fill="#A390AC" font-size="45">INSERT REAL PACKAGING PHOTO</text></g></g><text x="120" y="2315" fill="#96869C" font-family="Inter,Arial,sans-serif" font-size="39">Use only approved images, confirmed packaging and verified dispatch claims.</text></svg>