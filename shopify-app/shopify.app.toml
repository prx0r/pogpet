# This file stores configurations for your Shopify app.

client_id = ""  # set via SHOPIFY_API_KEY in .env — never commit the real id/secret here

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: look up existing products by handle before upsert (sync is idempotent)
scopes = "write_products,read_products,write_product_listings,read_product_listings,write_publications,read_publications,write_product_metafields,read_product_metafields,write_files_41,read_files_41,write_themes,read_themes,write_content,read_content,write_menus,read_menus,write_orders,read_orders,write_draft_orders,read_draft_orders,write_customers,read_customers,write_inventory,read_inventory,write_fulfillments,read_fulfillments,write_shipping,read_shipping,write_webhooks,read_webhooks,read_analytics"

[webhooks]
api_version = "2024-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks can have filters
  # Only receive webhooks for product updates with a product price >= 10.00
  # See: https://shopify.dev/docs/apps/build/webhooks/customize/filters
  # [[webhooks.subscriptions]]
  # topics = ["products/update"]
  # uri = "/webhooks/products/update"
  # filter = "variants.price:>=10.00"

  # Mandatory compliance topic for public apps only
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/data_request"
  # compliance_topics = ["customers/data_request"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/redact"
  # compliance_topics = ["customers/redact"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/shop/redact"
  # compliance_topics = ["shop/redact"]
