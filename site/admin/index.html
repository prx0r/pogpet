<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MythicBee Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    
    h1 { font-size: 28px; margin-bottom: 24px; color: #d4af37; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab { padding: 10px 20px; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; cursor: pointer; color: #888; }
    .tab.active { background: #d4af37; color: #000; border-color: #d4af37; }
    
    .panel { display: none; }
    .panel.active { display: block; }
    
    .card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #333; }
    .card h3 { margin-bottom: 12px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #eee; font-size: 14px; }
    textarea { min-height: 80px; resize: vertical; }
    
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn--primary { background: #d4af37; color: #000; }
    .btn--primary:hover { background: #b8941f; }
    .btn--ghost { background: transparent; border: 1px solid #333; color: #eee; }
    .btn--danger { background: #e74c3c; color: white; }
    
    .order-list { list-style: none; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
    .order-item:last-child { border-bottom: none; }
    .order-id { font-family: monospace; color: #d4af37; }
    .order-status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .status-pending { background: #f39c12; color: #000; }
    .status-image_ready { background: #3498db; color: white; }
    .status-approved { background: #27ae60; color: white; }
    .status-fulfilled { background: #8e44ad; color: white; }
    
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat { background: #1a1a2e; border-radius: 12px; padding: 20px; text-align: center; }
    .stat__value { font-size: 32px; font-weight: 700; color: #d4af37; }
    .stat__label { font-size: 12px; color: #888; margin-top: 4px; }
    
    .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .image-option { border: 2px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .image-option:hover { border-color: #d4af37; }
    .image-option.selected { border-color: #27ae60; }
    .image-option img { width: 100%; display: block; }
    
    .preview { margin-top: 16px; }
    .preview img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MythicBee Admin</h1>
    
    <div class="tabs">
      <div class="tab active" data-tab="orders">Orders</div>
      <div class="tab" data-tab="generate">Generate</div>
      <div class="tab" data-tab="stats">Stats</div>
    </div>
    
    <!-- Orders Panel -->
    <div class="panel active" id="panel-orders">
      <div class="card">
        <h3>New Order</h3>
        <div class="grid">
          <div>
            <label>Product Type</label>
            <select id="order-type">
              <option value="dogcasso">Dogcasso</option>
              <option value="gamewinners">GameWinners</option>
            </select>
          </div>
          <div>
            <label>Variant</label>
            <select id="order-variant">
              <option value="digital">Digital (£9)</option>
              <option value="card">Card (£24)</option>
              <option value="print">Print (£29)</option>
              <option value="acrylic">Acrylic (£49)</option>
            </select>
          </div>
          <div>
            <label>Recipient Name</label>
            <input type="text" id="order-recipient" placeholder="Dad">
          </div>
          <div>
            <label>Relationship</label>
            <select id="order-relationship">
              <option value="dad">Dad</option>
              <option value="mum">Mum</option>
              <option value="partner">Partner</option>
              <option value="friend">Friend</option>
              <option value="pet">Pet</option>
            </select>
          </div>
          <div>
            <label>Brief Description</label>
            <textarea id="order-brief" placeholder="Arsenal fan, 60, sarcastic, likes beer, has a labrador called Dave..."></textarea>
          </div>
          <div>
            <label>Customer Photo URL</label>
            <input type="text" id="order-photo" placeholder="https://...">
          </div>
        </div>
        <button class="btn btn--primary" onclick="createOrder()" style="margin-top: 16px;">Create Order</button>
      </div>
      
      <div class="card">
        <h3>Order Queue</h3>
        <ul class="order-list" id="order-list">
          <li class="order-item" style="color: #666;">No orders yet</li>
        </ul>
      </div>
    </div>
    
    <!-- Generate Panel -->
    <div class="panel" id="panel-generate">
      <div class="card">
        <h3>Generate Images</h3>
        <div class="grid">
          <div>
            <label>Style</label>
            <select id="gen-style">
              <option value="renaissance">Renaissance</option>
              <option value="pop_art">Pop Art</option>
              <option value="watercolor">Watercolor</option>
              <option value="anime">Anime</option>
            </select>
          </div>
          <div>
            <label>Prompt (auto-filled from order)</label>
            <input type="text" id="gen-prompt" placeholder="A golden retriever in renaissance style...">
          </div>
        </div>
        <button class="btn btn--primary" onclick="generateImages()" style="margin-top: 16px;">Generate 3 Candidates</button>
        
        <div class="image-grid" id="gen-results"></div>
      </div>
    </div>
    
    <!-- Stats Panel -->
    <div class="panel" id="panel-stats">
      <div class="stats" id="stats-grid">
        <div class="stat"><div class="stat__value" id="stat-total">0</div><div class="stat__label">Total Orders</div></div>
        <div class="stat"><div class="stat__value" id="stat-revenue">£0</div><div class="stat__label">Revenue</div></div>
        <div class="stat"><div class="stat__value" id="stat-digital">0</div><div class="stat__label">Digital</div></div>
        <div class="stat"><div class="stat__value" id="stat-physical">0</div><div class="stat__label">Physical</div></div>
      </div>
    </div>
  </div>

  <script type="module">
    import OrderManager from '../js/orders.js';
    import GenerationPipeline from '../js/generation.js';
    
    const orders = new OrderManager();
    const generator = new GenerationPipeline();
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
      });
    });
    
    // Create order
    window.createOrder = async function() {
      const type = document.getElementById('order-type').value;
      const variant = document.getElementById('order-variant').value;
      const recipient = document.getElementById('order-recipient').value;
      const brief = document.getElementById('order-brief').value;
      
      const prices = { digital: 9, card: 24, print: 29, acrylic: 49 };
      
      const order = orders.createOrder({
        productType: type,
        variant: variant,
        recipientName: recipient || 'Legend',
        relationship: document.getElementById('order-relationship').value,
        description: brief,
        price: prices[variant],
        customerPhoto: document.getElementById('order-photo').value
      });
      
      alert(`Order ${order.id} created!`);
      renderOrders();
    };
    
    // Generate images
    window.generateImages = async function() {
      const style = document.getElementById('gen-style').value;
      const prompt = document.getElementById('gen-prompt').value || 'a beautiful portrait';
      
      const resultsDiv = document.getElementById('gen-results');
      resultsDiv.innerHTML = '<p style="color: #888;">Generating...</p>';
      
      const results = await generator.generateCandidates(prompt, 3);
      
      resultsDiv.innerHTML = results.map((r, i) => `
        <div class="image-option" onclick="selectImage(${i})">
          <img src="${r.image}" alt="Option ${i + 1}">
        </div>
      `).join('');
    };
    
    window.selectImage = function(index) {
      document.querySelectorAll('.image-option').forEach((el, i) => {
        el.classList.toggle('selected', i === index);
      });
    };
    
    // Render orders
    function renderOrders() {
      const list = document.getElementById('order-list');
      const allOrders = orders.getOrders();
      
      if (allOrders.length === 0) {
        list.innerHTML = '<li class="order-item" style="color: #666;">No orders yet</li>';
        return;
      }
      
      list.innerHTML = allOrders.map(o => `
        <li class="order-item">
          <div>
            <span class="order-id">${o.id}</span>
            <span style="margin-left: 12px;">${o.product.type} - ${o.brief.recipient}</span>
          </div>
          <div>
            <span class="order-status status-${o.status}">${o.status}</span>
            <span style="margin-left: 12px;">£${o.product.price}</span>
          </div>
        </li>
      `).join('');
      
      // Update stats
      const stats = orders.getStats();
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-revenue').textContent = `£${stats.revenue}`;
      document.getElementById('stat-digital').textContent = stats.digital;
      document.getElementById('stat-physical').textContent = stats.physical;
    }
    
    renderOrders();
  </script>
</body>
</html>
