<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Subtle noise texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="soft-light"/>
    </filter>

    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star silhouette clip path (8-point asymmetric) -->
    <clipPath id="star-clip">
      <path d="M100 10 L118 72 L180 72 L130 112 L148 175 L100 140 L52 175 L70 112 L20 72 L82 72 Z"/>
    </clipPath>

    <!-- Thread pattern A (diagonal) -->
    <pattern id="weave-a" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#efce86" stroke-width="1.4" opacity=".82"/>
    </pattern>

    <!-- Thread pattern B (crossing diagonal) -->
    <pattern id="weave-b" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d4a84a" stroke-width="1.2" opacity=".65"/>
    </pattern>
  </defs>

  <!-- Soft under-glow -->
  <circle cx="100" cy="100" r="70" fill="#E3B45D" opacity=".15" filter="url(#glow)"/>

  <!-- Dark gold silhouette base -->
  <path d="M100 10 L118 72 L180 72 L130 112 L148 175 L100 140 L52 175 L70 112 L20 72 L82 72 Z" 
        fill="#ad7d38" filter="url(#noise)"/>

  <!-- Thread set A -->
  <g clip-path="url(#star-clip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#weave-a)"/>
  </g>

  <!-- Thread set B -->
  <g clip-path="url(#star-clip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#weave-b)"/>
  </g>

  <!-- Highlight threads (curved) -->
  <g clip-path="url(#star-clip)" opacity=".7">
    <path d="M60 40 Q100 80 140 40" stroke="#f2d696" stroke-width="1" fill="none" class="animate-thread-draw"/>
    <path d="M40 100 Q100 60 160 100" stroke="#f2d696" stroke-width=".8" fill="none" class="animate-thread-draw" style="animation-delay: 100ms"/>
    <path d="M70 160 Q100 120 130 160" stroke="#f2d696" stroke-width=".9" fill="none" class="animate-thread-draw" style="animation-delay: 200ms"/>
  </g>

  <!-- Central knot -->
  <circle cx="100" cy="100" r="8" fill="#E3B45D" opacity=".9"/>
  <circle cx="100" cy="100" r="4" fill="#f2d696"/>

  <!-- Travelling glint (subtle) -->
  <circle r="2" fill="#fff" opacity=".6">
    <animateMotion dur="5.8s" repeatCount="indefinite" path="M60 40 Q100 80 140 40"/>
    <animate attributeName="opacity" values="0;.6;0" dur="5.8s" repeatCount="indefinite"/>
  </circle>
</svg>
